[package]
name = "hyper-mcp-proxy"
version = "0.3.5"
edition = "2024"
authors = ["Joseph Wortmann <joseph.wortmann@gmail.com>"]
description = "A streamable-http to stdio MCP proxy"
keywords = ["rust", "ai", "mcp", "cli", "streamable-http"]
categories = ["command-line-utilities"]
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/hyper-mcp-rs/hyper-mcp-proxy"
homepage = "https://github.com/hyper-mcp-rs/hyper-mcp-proxy"
documentation = "https://github.com/hyper-mcp-rs/hyper-mcp-proxy"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
http = "1"
rmcp = { version = "2.2", features = [
    "server",
    "client",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
    "transport-child-process",
    "elicitation",
] }
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
libc = "0.2"
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "2.2", features = [
    "client",
    "server",
    "transport-io",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["full"] }

[[bin]]
name = "hyper-mcp-proxy"
path = "src/main.rs"

# Mock stdio MCP server used only by integration tests. Built whenever
# `cargo test` (or any other target that pulls in dev-dependencies) runs,
# located via `env!("CARGO_BIN_EXE_mock-mcp-child")` from the test code.
# It compiles for `cargo build` too — the binary is tiny and depending on
# a dev-only Cargo feature would force callers to remember a flag.
[[bin]]
name = "mock-mcp-child"
path = "tests/support/mock_mcp_child.rs"
test = false
bench = false
doc = false

[package.metadata.release]
publish = true
push = true
tag = true
tag-name = "v{{version}}"
